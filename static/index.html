<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>JobPilot — Step 1 Test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 0.9rem; }
  textarea, input[type=file] { width: 100%; margin-top: 6px; box-sizing: border-box; }
  textarea { min-height: 120px; font-family: inherit; padding: 8px; }
  button { margin-top: 20px; padding: 10px 18px; background: #111; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #result { margin-top: 24px; white-space: pre-wrap; background: #f5f5f5; padding: 16px; border-radius: 8px; display: none; }
  .score { font-size: 2rem; font-weight: 700; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; margin: 2px; }
  .matched { background: #d4f4dd; }
  .missing { background: #fde2e2; }
  .warn { background: #fff3cd; }
</style>
</head>
<body>
  <h1>JobPilot — Step 1: Resume Match Score</h1>
  <p>Upload a resume (or paste text) and a job description to test the AI match scoring.</p>

  <form id="matchForm">
    <label>Job description</label>
    <textarea name="job_description" placeholder="Paste the job description here..." required></textarea>

    <label>Resume file (PDF, DOCX, or TXT)</label>
    <input type="file" name="resume_file" accept=".pdf,.docx,.txt" />

    <label>...or paste resume text instead</label>
    <textarea name="pasted_resume_text" placeholder="Paste resume text here if not uploading a file..."></textarea>

    <button type="submit">Get Match Score</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('matchForm');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      button.textContent = 'Scoring...';
      resultDiv.style.display = 'block';
      resultDiv.textContent = 'Contacting Groq...';

      try {
        const formData = new FormData(form);
        const res = await fetch('/api/match', { method: 'POST', body: formData });
        const data = await res.json();

        if (!res.ok) {
          resultDiv.textContent = 'Error: ' + (data.detail || JSON.stringify(data));
          return;
        }

        resultDiv.innerHTML = `
          <div class="score">${data.match_score}% match</div>
          <p>${data.summary}</p>
          <p><strong>Matched:</strong><br>
            ${data.matched_skills.map(s => `<span class="tag matched">${s}</span>`).join('')}
          </p>
          <p><strong>Missing:</strong><br>
            ${data.missing_skills.map(s => `<span class="tag missing">${s}</span>`).join('')}
          </p>
          <p><strong>ATS warnings:</strong><br>
            ${data.ats_warnings.map(s => `<span class="tag warn">${s}</span>`).join('') || 'None'}
          </p>
        `;
      } catch (err) {
        resultDiv.textContent = 'Request failed: ' + err;
      } finally {
        button.disabled = false;
        button.textContent = 'Get Match Score';
      }
    });
  </script>
</body>
</html>
